apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-query-router-backend
  namespace: smart-query-router
  labels:
    app.kubernetes.io/name: smart-query-router-backend
    app.kubernetes.io/part-of: smart-query-router
    app.kubernetes.io/component: backend
    app: smart-query-router-backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-query-router-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-query-router-backend
        app.kubernetes.io/part-of: smart-query-router
        app.kubernetes.io/component: backend
        app: smart-query-router-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: smart-query-router-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: smart-query-router-config
            - secretRef:
                name: smart-query-router-secrets
