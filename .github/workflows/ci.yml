name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Extension Build Integrity, Manifest V3 & Unit Tests
  # ============================================================================
  extension-integrity:
    name: Extension Build Integrity & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Manifest V3 & Run All Extension Test Suites
        run: |
          node extension/tests/run_all_tests.js

  # ============================================================================
  # Stage 2: Backend Code Quality, Static Linting & Dependency Security
  # ============================================================================
  backend-lint-and-audit:
    name: Backend Linting & Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit -r backend/requirements.txt

      - name: Run Backend Static Linting (Ruff)
        run: |
          ruff check backend

      - name: Run Dependency & Manifest Security Audit
        run: |
          python backend/scripts/audit_dependencies.py

      - name: Validate Kubernetes Manifests & Policies
        run: |
          python backend/scripts/validate_k8s.py
          kubectl kustomize k8s/

  # ============================================================================
  # Stage 3: Backend Automated Test Suite
  # ============================================================================
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Full Pytest Suite
        run: |
          cd backend
          pytest tests -v --tb=short

  # ============================================================================
  # Stage 4: Container Build & Orchestration Integration Smoke Test
  # ============================================================================
  integration-smoke:
    name: Container & Orchestration Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [extension-integrity, backend-lint-and-audit, backend-tests]
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies for Smoke Test
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Integration Smoke Test Script
        run: |
          cd backend
          python scripts/smoke_test.py

      - name: Build Docker Container Image
        run: |
          docker build -t smart-query-router-backend:smoke -f backend/Dockerfile backend

      - name: Run Ephemeral Container & Verify Probes
        run: |
          docker run -d --name smoke-container -p 8000:8000 smart-query-router-backend:smoke
          sleep 4
          # Verify liveness, readiness, and startup probes
          curl --fail --retry 5 --retry-connrefused http://localhost:8000/startupz
          curl --fail http://localhost:8000/healthz
          curl --fail http://localhost:8000/readyz
          # Verify non-root user execution
          CONTAINER_USER=$(docker exec smoke-container whoami)
          echo "Container running as user: $CONTAINER_USER"
          test "$CONTAINER_USER" = "appuser"
          # Clean teardown
          docker stop smoke-container
